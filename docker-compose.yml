# Local development: Postgres + MinIO. Run the service on the host with
# `make run` (local driver) or point it at MinIO:
#   FILES_STORAGE_DRIVER=s3 FILES_S3_ENDPOINT=http://localhost:9000 \
#   FILES_S3_BUCKET=files FILES_S3_ACCESS_KEY=minio FILES_S3_SECRET_KEY=minio-secret make run
# `docker compose --profile app up` also runs the service itself in a container.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: files
      POSTGRES_PASSWORD: files
      POSTGRES_DB: files
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U files"]
      interval: 2s
      timeout: 3s
      retries: 30

  # MinIO no longer publishes community images; this is the last Bitnami
  # build (creates the buckets itself).
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
      MINIO_DEFAULT_BUCKETS: files,files-test
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  files:
    profiles: [app]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENV: development
      DATABASE_URL: postgres://files:files@postgres:5432/files?sslmode=disable
      FILES_PUBLIC_URL: http://localhost:8080
      INTERNAL_TOKEN: dev-internal-token
      FILES_GUEST_SECRET: dev-guest-secret-0123456789
      FILES_STORAGE_DRIVER: s3
      FILES_S3_ENDPOINT: http://minio:9000
      FILES_S3_BUCKET: files
      FILES_S3_ACCESS_KEY: minio
      FILES_S3_SECRET_KEY: minio-secret
      # Dev only: MinIO's disk is the host's; no capacity budget.
      FILES_STORAGE_MIN_FREE: "0"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:3001:3001"

volumes:
  pgdata:
  miniodata:
